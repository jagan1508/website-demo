apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jagan1508/website-demo.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-1
  
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    
    automated:
      prune: true
      selfHeal: true