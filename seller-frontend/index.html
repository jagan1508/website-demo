<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Shop — Seller Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & Variables ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0c0b09;
  --surface:      #141210;
  --card:         #1a1815;
  --card-hover:   #201e1a;
  --border:       #2a2620;
  --border-light: #3a3530;
  --text:         #e2d9c8;
  --text-muted:   #7a7060;
  --text-dim:     #504840;
  --accent:       #c8a96a;
  --accent-hover: #dfc080;
  --accent-dim:   rgba(200,169,106,0.14);
  --danger:       #c47a5a;
  --danger-dim:   rgba(196,122,90,0.14);
  --success:      #7a9e7e;
  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-mono:    'DM Mono', 'Courier New', monospace;
  --radius:       2px;
  --tr:           0.18s ease;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

/* ── Setup Banner ────────────────────────────────────────────────── */
#setupBanner {
  background: rgba(200,169,106,0.07);
  border-bottom: 1px solid var(--border);
  padding: 0.55rem 2rem;
  font-size: 0.7rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  letter-spacing: 0.03em;
}

#setupBanner code {
  background: var(--card);
  padding: 0.1rem 0.45rem;
  border-radius: 2px;
  color: var(--accent);
  font-size: 0.68rem;
  font-family: var(--font-mono);
}

.dismiss-x {
  background: none; border: none;
  color: var(--text-dim); cursor: pointer;
  font-size: 0.85rem; flex-shrink: 0;
  transition: color var(--tr);
}
.dismiss-x:hover { color: var(--text); }

/* ── Header ──────────────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-main {
  display: flex; align-items: center;
  justify-content: space-between;
  height: 62px;
}

.logo {
  font-family: var(--font-serif);
  font-size: 1.8rem; font-weight: 400;
  letter-spacing: 0.3em; color: var(--text);
  text-decoration: none; text-transform: uppercase;
}
.logo em { color: var(--accent); font-style: italic; }

.header-actions { display: flex; align-items: center; gap: 0.75rem; }

.icon-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer;
  padding: 0.4rem 0.6rem; border-radius: var(--radius);
  display: flex; align-items: center; gap: 0.35rem;
  font-family: var(--font-mono); font-size: 0.72rem;
  transition: all var(--tr); position: relative;
}
.icon-btn:hover { border-color: var(--border-light); color: var(--text); }
.icon-btn.accent:hover { border-color: var(--accent); color: var(--accent); }

/* ── Category Nav ────────────────────────────────────────────────── */
.cat-nav {
  display: flex; align-items: center;
  border-top: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
  padding: 0;
}
.cat-nav::-webkit-scrollbar { display: none; }

.cat-pill {
  background: none; border: none;
  color: var(--text-muted);
  font-family: var(--font-mono); font-size: 0.68rem;
  font-weight: 400; letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.55rem 1.2rem;
  cursor: pointer; white-space: nowrap;
  transition: color var(--tr);
  position: relative; border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.cat-pill::after {
  content: ''; position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px; background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.2s ease;
}
.cat-pill:hover { color: var(--text); }
.cat-pill.active { color: var(--accent); }
.cat-pill.active::after { transform: scaleX(1); }

/* ── Toolbar ─────────────────────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 1.4rem 2rem 1rem;
  gap: 1rem;
}

.search-wrap { position: relative; flex: 1; max-width: 380px; }
.search-wrap svg {
  position: absolute; left: 0.7rem; top: 50%;
  transform: translateY(-50%); color: var(--text-dim);
  pointer-events: none;
}
.search-input {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border); color: var(--text);
  font-family: var(--font-mono); font-size: 0.78rem;
  padding: 0.58rem 0.75rem 0.58rem 2.2rem;
  border-radius: var(--radius); outline: none;
  transition: border-color var(--tr);
}
.search-input:focus { border-color: var(--border-light); }
.search-input::placeholder { color: var(--text-dim); }

.toolbar-btns { display: flex; gap: 0.5rem; }

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn {
  font-family: var(--font-mono); font-size: 0.72rem;
  font-weight: 400; letter-spacing: 0.1em;
  padding: 0.52rem 1.2rem;
  border-radius: var(--radius); border: 1px solid;
  cursor: pointer; transition: all var(--tr);
  display: inline-flex; align-items: center;
  gap: 0.4rem; white-space: nowrap;
  text-transform: uppercase;
}
.btn-primary {
  background: var(--accent); border-color: var(--accent);
  color: var(--bg);
}
.btn-primary:hover {
  background: var(--accent-hover); border-color: var(--accent-hover);
}
.btn-secondary {
  background: transparent; border-color: var(--border-light);
  color: var(--text-muted);
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger {
  background: transparent; border-color: var(--danger); color: var(--danger);
}
.btn-danger:hover { background: var(--danger-dim); }
.btn-ghost {
  background: transparent; border-color: transparent; color: var(--text-muted);
}
.btn-ghost:hover { color: var(--text); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ── Products ────────────────────────────────────────────────────── */
.products-section { padding: 0 2rem 5rem; }

.products-meta {
  font-size: 0.68rem; color: var(--text-dim);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 1.25rem;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1px; background: var(--border);
}

/* ── Product Card ─────────────────────────────────────────────────── */
.product-card {
  background: var(--card); cursor: pointer;
  transition: background var(--tr);
  animation: fadeUp 0.35s ease both;
  position: relative; overflow: hidden;
}
.product-card:hover { background: var(--card-hover); }
.product-card:hover .card-overlay { opacity: 1; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-img-wrap {
  width: 100%; aspect-ratio: 4/3;
  position: relative; overflow: hidden;
  background: var(--surface);
}

.card-img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform 0.4s ease;
}
.product-card:hover .card-img { transform: scale(1.03); }

.card-img-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.card-img-placeholder::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(200,169,106,0.07) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(196,122,90,0.04) 0%, transparent 60%);
}

.card-overlay {
  position: absolute; inset: 0;
  background: rgba(12,11,9,0.4);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity var(--tr);
}
.card-overlay-label {
  font-size: 0.65rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--text);
  border: 1px solid rgba(226,217,200,0.5);
  padding: 0.4rem 1rem; border-radius: var(--radius);
}

.card-body { padding: 0.9rem 1.1rem 1.1rem; }
.card-cat {
  font-size: 0.62rem; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 0.35rem;
}
.card-title {
  font-family: var(--font-serif); font-size: 1.1rem;
  font-weight: 400; color: var(--text);
  line-height: 1.25; margin-bottom: 0.7rem;
}
.card-footer {
  display: flex; align-items: center;
  justify-content: space-between;
}
.card-price { color: var(--accent); font-size: 0.82rem; }

/* Stock badges */
.badge {
  font-size: 0.6rem; padding: 0.18rem 0.48rem;
  border-radius: 1px; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.badge-ok  { background: rgba(122,158,126,0.15); color: var(--success); }
.badge-low { background: var(--accent-dim); color: var(--accent); }
.badge-out { background: var(--danger-dim); color: var(--danger); }

/* ── Empty State ─────────────────────────────────────────────────── */
.empty-state {
  grid-column: 1/-1; background: none;
  text-align: center; padding: 6rem 2rem;
}
.empty-glyph {
  font-family: var(--font-serif); font-size: 5rem;
  font-style: italic; color: var(--border-light);
  display: block; margin-bottom: 1rem;
}
.empty-title {
  font-family: var(--font-serif); font-size: 1.6rem;
  font-weight: 300; color: var(--text-muted);
  margin-bottom: 0.4rem;
}
.empty-sub { font-size: 0.75rem; color: var(--text-dim); }

/* ── Skeleton ────────────────────────────────────────────────────── */
.skel-card { background: var(--card); }
.skel-img {
  width: 100%; aspect-ratio: 4/3;
  background: linear-gradient(90deg,var(--surface) 25%,var(--card) 50%,var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
.skel-body { padding: 0.9rem 1.1rem 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.skel-line {
  height: 11px; border-radius: 1px;
  background: linear-gradient(90deg,var(--surface) 25%,var(--card) 50%,var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer {
  0%   { background-position:  200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Modal Overlay ───────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(10,9,7,0.85);
  backdrop-filter: blur(5px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.18s ease both;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); width: 100%;
  max-width: 560px; max-height: 92vh; overflow-y: auto;
  animation: slideUp 0.22s ease both;
}
.modal-lg { max-width: 740px; }
@keyframes slideUp {
  from { transform: translateY(14px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-header {
  display: flex; align-items: flex-start;
  justify-content: space-between;
  padding: 1.5rem 1.75rem 1rem;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-family: var(--font-serif); font-size: 1.65rem;
  font-weight: 300; font-style: italic; color: var(--text);
  line-height: 1.2;
}
.modal-sub {
  font-size: 0.68rem; color: var(--text-muted);
  margin-top: 0.2rem; letter-spacing: 0.09em;
  text-transform: uppercase;
}
.close-btn {
  background: none; border: none; color: var(--text-dim);
  cursor: pointer; padding: 0.2rem;
  transition: color var(--tr); flex-shrink: 0;
}
.close-btn:hover { color: var(--text); }

.modal-body { padding: 1.5rem 1.75rem; }
.modal-footer {
  display: flex; align-items: center;
  justify-content: flex-end; gap: 0.65rem;
  padding: 1rem 1.75rem 1.5rem;
  border-top: 1px solid var(--border);
}

/* ── Detail Modal ────────────────────────────────────────────────── */
.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
}
.detail-img-col {
  aspect-ratio: 1; background: var(--card);
  overflow: hidden; position: relative;
}
.detail-img-col img {
  width: 100%; height: 100%; object-fit: cover;
}
.detail-img-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.detail-img-placeholder::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(200,169,106,0.09) 0%, transparent 70%);
}

.detail-info {
  padding: 2rem;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
}
.detail-cat {
  font-size: 0.62rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 0.6rem;
}
.detail-title {
  font-family: var(--font-serif); font-size: 2rem;
  font-weight: 300; font-style: italic;
  line-height: 1.15; margin-bottom: 0.75rem;
}
.detail-price { font-size: 1.2rem; color: var(--accent); margin-bottom: 0.4rem; }
.detail-stock { margin-bottom: 1.25rem; }
.detail-desc {
  font-size: 0.78rem; color: var(--text-muted);
  line-height: 1.75; flex: 1; margin-bottom: 1.5rem;
}
.detail-actions { display: flex; flex-direction: column; gap: 0.5rem; }
.detail-meta {
  padding: 1rem 2rem;
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between; gap: 0.5rem;
}

/* ── Forms ───────────────────────────────────────────────────────── */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
}
.form-group { display: flex; flex-direction: column; gap: 0.38rem; }
.form-group.span2 { grid-column: 1/-1; }

label {
  font-size: 0.67rem; letter-spacing: 0.11em;
  text-transform: uppercase; color: var(--text-muted);
}
input, select, textarea {
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-family: var(--font-mono);
  font-size: 0.78rem; font-weight: 300;
  padding: 0.58rem 0.85rem;
  border-radius: var(--radius); outline: none;
  transition: border-color var(--tr); width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 78px; }
select option { background: var(--card); }
.form-hint { font-size: 0.66rem; color: var(--text-dim); }
.field-error { border-color: var(--danger) !important; }

/* cart UI removed for Seller Dashboard */
/* ── Error Banner ────────────────────────────────────────────────── */
#errorBanner {
  display: none; margin: 0 2rem 1rem;
  background: var(--danger-dim); border: 1px solid var(--danger);
  color: var(--danger); padding: 0.7rem 1rem;
  font-size: 0.75rem; border-radius: var(--radius);
  line-height: 1.5;
}

/* ── Toasts ──────────────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  z-index: 500; display: flex; flex-direction: column;
  gap: 0.45rem; pointer-events: none;
}
.toast {
  background: var(--surface); border: 1px solid var(--border);
  padding: 0.7rem 1.1rem; font-size: 0.76rem;
  border-left: 3px solid;
  animation: toastIn 0.22s ease both, toastOut 0.28s ease 2.7s both;
  pointer-events: all; max-width: 280px; line-height: 1.4;
}
.toast-success { border-left-color: var(--success); }
.toast-error   { border-left-color: var(--danger); }
.toast-info    { border-left-color: var(--accent); }
@keyframes toastIn  { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:none} }
@keyframes toastOut { to  {opacity:0;transform:translateX(10px)} }

/* ── Misc ────────────────────────────────────────────────────────── */
hr.divider { border:none; border-top:1px solid var(--border); margin:1rem 0; }

/* ── Responsive ──────────────────────────────────────────────────── */
@media (max-width: 680px) {
  header { padding: 0 1rem; }
  .toolbar { padding: 1rem; flex-wrap: wrap; }
  .products-section { padding: 0 1rem 5rem; }
  .products-grid { grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); }
  .detail-grid { grid-template-columns: 1fr; }
  .detail-img-col { aspect-ratio: 16/9; }
  .detail-info { border-left: none; border-top: 1px solid var(--border); }
  .form-grid { grid-template-columns: 1fr; }
  .form-group.span2 { grid-column: auto; }
  .cart-drawer { width: 100%; }
}
</style>
</head>
<body>

<!-- Setup Banner -->
<div id="setupBanner">
  <span>
    ⚙ Ensure CORS is enabled in <code>main.py</code> and backend is running at
    <code id="apiBaseDisplay">http://localhost:8000</code>
  </span>
  <button class="dismiss-x" onclick="document.getElementById('setupBanner').remove()">✕</button>
</div>

<!-- ── Header ─────────────────────────────────────────────────────── -->
<header>
  <div class="header-main">
    <a class="logo" href="#">Art <em>Shop</em></a>
    <div class="header-actions">
        <button class="icon-btn" onclick="openStatsModal()" title="Dashboard stats">
          <!-- stats icon -->
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="3" y="10" width="4" height="11" rx="1"/>
            <rect x="10" y="6" width="4" height="15" rx="1"/>
            <rect x="17" y="3" width="4" height="18" rx="1"/>
          </svg>
          Stats
        </button>
        <button class="icon-btn accent" onclick="openConfigModal()" title="Configure API URL">
        <!-- gear icon -->
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        API
      </button>
    </div>
  </div>
  <!-- Category filter nav -->
  <nav class="cat-nav" id="catNav">
    <button class="cat-pill active" data-id="all" onclick="filterCat(null,this)">All</button>
  </nav>
</header>

<!-- ── Toolbar ─────────────────────────────────────────────────────── -->
<div class="toolbar">
  <div class="search-wrap">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input class="search-input" type="text" id="searchInput"
           placeholder="Search artworks…" oninput="handleSearch(this.value)">
  </div>
  <div class="toolbar-btns">
    <button class="btn btn-secondary" onclick="openAddCatModal()">+ Category</button>
    <button class="btn btn-primary"   onclick="openAddProductModal()">+ Artwork</button>
  </div>
</div>

<!-- Error banner -->
<div id="errorBanner"></div>

<!-- ── Products ────────────────────────────────────────────────────── -->
<div class="products-section">
  <div id="productsMeta" class="products-meta"></div>
  <div id="productsGrid" class="products-grid">
    <!-- Skeletons shown while loading -->
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:38%"></div><div class="skel-line" style="width:75%"></div><div class="skel-line" style="width:55%"></div></div></div>
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:45%"></div><div class="skel-line" style="width:82%"></div><div class="skel-line" style="width:60%"></div></div></div>
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:30%"></div><div class="skel-line" style="width:68%"></div><div class="skel-line" style="width:50%"></div></div></div>
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:42%"></div><div class="skel-line" style="width:79%"></div><div class="skel-line" style="width:58%"></div></div></div>

<!-- ═══════════════════════════ SCRIPT ═══════════════════════════════ -->
<script>
'use strict';

// ── Config ───────────────────────────────────────────────────────────
let API_BASE = (localStorage.getItem('api_base') || 'http://localhost:8000').replace(/\/$/, '');
document.getElementById('apiBaseDisplay').textContent = API_BASE;

// ── State ─────────────────────────────────────────────────────────────
let allProducts  = [];
let allCategories = [];
let activeCategory = null;
let searchQuery   = '';

// ── API Layer ─────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    ...opts,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch(_) {}
    throw new Error(detail);
  }
  if (res.status === 204) return null;
  return res.json();
}

const API = {
  products: {
    list:   ()       => apiFetch('/products/'),
    get:    (id)     => apiFetch(`/products/${id}`),
    create: (data)   => apiFetch('/products/', { method:'POST', body:JSON.stringify(data) }),
    update: (id,data)=> apiFetch(`/products/${id}`, { method:'PUT', body:JSON.stringify(data) }),
    delete: (id)     => apiFetch(`/products/${id}`, { method:'DELETE' }),
  },
  categories: {
    list:   ()     => apiFetch('/categories/'),
    create: (data) => apiFetch('/categories/', { method:'POST', body:JSON.stringify(data) }),
  },
};

// ── Helpers ───────────────────────────────────────────────────────────
function esc(s) {
  if (!s && s !== 0) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function fmt(price) {
  return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR' }).format(price);
}

function catName(id) {
  const c = allCategories.find(x => x.id === id);
  return c ? c.name : '—';
}

function stockBadge(stock) {
  if (stock <= 0)  return `<span class="badge badge-out">Out of stock</span>`;
  if (stock <= 3)  return `<span class="badge badge-low">${stock} left</span>`;
  return                  `<span class="badge badge-ok">${stock} in stock</span>`;
}

function placeholderSVG(size=40) {
  return `<svg width="${size}" height="${size}" fill="none" stroke="#3a3530" stroke-width="1" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <circle cx="8.5" cy="8.5" r="1.5"/>
    <path d="m21 15-5-5L5 21"/>
  </svg>`;
}

// ── Render Products Grid ──────────────────────────────────────────────
function filteredProducts() {
  return allProducts.filter(p => {
    const okCat    = !activeCategory || p.category_id === activeCategory;
    const okSearch = !searchQuery || p.title.toLowerCase().includes(searchQuery.toLowerCase());
    return okCat && okSearch;
  });
}

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  const meta = document.getElementById('productsMeta');
  const list = filteredProducts();
  meta.textContent = `${list.length} work${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="empty-glyph">∅</span>
        <div class="empty-title">No artworks found</div>
        <div class="empty-sub">Try a different filter or add the first piece to this collection.</div>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((p, i) => {
    const imgHtml = p.image_url
      ? `<img class="card-img" src="${esc(p.image_url)}" alt="${esc(p.title)}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      + `<div class="card-img-placeholder" style="display:none">${placeholderSVG()}</div>`
      : `<div class="card-img-placeholder">${placeholderSVG()}</div>`;

    return `
      <div class="product-card" onclick="openDetail(${p.id})" style="animation-delay:${Math.min(i,12)*0.035}s">
        <div class="card-img-wrap">
          ${imgHtml}
          <div class="card-overlay"><span class="card-overlay-label">View details</span></div>
        </div>
        <div class="card-body">
          <div class="card-cat">${esc(catName(p.category_id))}</div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-footer">
            <span class="card-price">${fmt(p.price)}</span>
            ${stockBadge(p.stock)}
          </div>
        </div>
      </div>`;
  }).join('');
}

// ── Categories Nav ────────────────────────────────────────────────────
function renderCatNav() {
  const nav = document.getElementById('catNav');
  const allPill = nav.querySelector('[data-id="all"]');
  nav.innerHTML = '';
  nav.appendChild(allPill);
  allCategories.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-pill';
    btn.dataset.id = c.id;
    btn.textContent = c.name;
    btn.onclick = () => filterCat(c.id, btn);
    nav.appendChild(btn);
  });
}

function filterCat(id, btn) {
  activeCategory = id;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function handleSearch(val) {
  searchQuery = val;
  renderProducts();
}

// ── Product Detail Modal ──────────────────────────────────────────────
async function openDetail(id) {
  let p = allProducts.find(x => x.id === id);
  if (!p) { try { p = await API.products.get(id); } catch(e) { return; } }
  const cat = catName(p.category_id);

  const imgCol = p.image_url
    ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}"
            onerror="this.parentElement.innerHTML='<div class=detail-img-placeholder>${placeholderSVG(60).replace(/"/g,"'")}</div>'">`
    : `<div class="detail-img-placeholder">${placeholderSVG(60)}</div>`;

  // Serialize product safely for inline handler
  const pJson = JSON.stringify(p);

  showModal(`
    <div class="modal modal-lg" style="padding:0;overflow:hidden">
      <div class="detail-grid">
        <div class="detail-img-col">${imgCol}</div>
        <div class="detail-info">
          <div style="display:flex;justify-content:flex-end;margin-bottom:0.25rem">
            <button class="close-btn" onclick="closeModal()">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
          <div class="detail-cat">${esc(cat)}</div>
          <div class="detail-title">${esc(p.title)}</div>
          <div class="detail-price">${fmt(p.price)}</div>
          <div class="detail-stock">${stockBadge(p.stock)}</div>
          <div class="detail-desc">
            ${p.description ? esc(p.description) : '<em style="color:var(--text-dim)">No description provided.</em>'}
          </div>
          <div class="detail-actions">
            <button class="btn btn-primary"
              style="justify-content:center"
              onclick="closeModal();setTimeout(()=>openEditModal(window.__detailProduct),50)">
              Edit Artwork
            </button>

            <button class="btn btn-secondary"
              style="justify-content:center"
              onclick="quickStockUpdate(${p.id}, 1)">
              +1 Stock
            </button>

            <button class="btn btn-secondary"
              style="justify-content:center"
              onclick="quickStockUpdate(${p.id}, -1)">
              -1 Stock
            </button>
          </div>
        </div>
      </div>
      <div class="detail-meta">
        <span style="font-size:0.65rem;color:var(--text-dim)">ID: ${p.id}</span>
        <div style="display:flex;gap:0.5rem">
          <button class="btn btn-secondary" onclick="closeModal();setTimeout(()=>openEditModal(window.__detailProduct),50)">Edit</button>
          <button class="btn btn-danger"    onclick="confirmDelete(${p.id},'${esc(p.title).replace(/'/g,"\\'")}')">Delete</button>
        </div>
      </div>
    </div>`, p);
}



// ── Add Product Modal ─────────────────────────────────────────────────
function openAddProductModal() {
  const catOptions = allCategories.map(c =>
    `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  showModal(`
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">New Artwork</div>

        </div>

          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group span2">
            <label>Title *</label>
            <input id="f-title" type="text" placeholder="e.g. Study in Amber">
          </div>
          <div class="form-group span2">
            <label>Description</label>
            <textarea id="f-desc" placeholder="Medium, dimensions, notes on the piece…"></textarea>
          </div>
          <div class="form-group">
            <label>Price (USD) *</label>
            <input id="f-price" type="number" step="0.01" min="0" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Stock *</label>
            <input id="f-stock" type="number" min="0" placeholder="1">
          </div>
          <div class="form-group">

            <select id="f-cat">
              <option value="">— None —</option>

            </select>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input id="f-img" type="url" placeholder="https://…">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitProduct()">Add Artwork</button>
      </div>
    </div>`);
}

async function submitProduct() {
  const title = document.getElementById('f-title').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  const stock = parseInt(document.getElementById('f-stock').value, 10);

  if (!title)    { highlight('f-title'); showToast('Title is required','error'); return; }
  if (isNaN(price)) { highlight('f-price'); showToast('Price is required','error'); return; }
  if (isNaN(stock)) { highlight('f-stock'); showToast('Stock is required','error'); return; }

  const catVal = document.getElementById('f-cat').value;
  try {
    await API.products.create({
      title,
      description: document.getElementById('f-desc').value.trim() || null,
      price,
      stock,
      category_id: catVal ? parseInt(catVal,10) : null,
      image_url:   document.getElementById('f-img').value.trim() || null,
    });
    showToast('Artwork added to collection','success');
    closeModal();
    await loadProducts();
  } catch(e) { showToast(e.message,'error'); }
}

// ── Quick Stock Update (Seller) ──────────────────────────────────────
async function quickStockUpdate(id, change) {
  try {
    const product = allProducts.find(p => p.id === id);

    if (!product) return;

    const newStock = Math.max(0, product.stock + change);

    // If decrementing to zero, ask for confirmation
    if (change < 0 && newStock === 0) {
      const confirmed = confirm('This will set stock to 0. Continue?');
      if (!confirmed) return;
    }

    await API.products.update(id, {
      title: product.title,
      description: product.description,
      price: product.price,
      stock: newStock,
      category_id: product.category_id,
      image_url: product.image_url
    });

    showToast('Stock updated', 'success');

    await loadProducts();

    closeModal();

    setTimeout(() => openDetail(id), 150);

  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function submitEdit(id) {

            <div style="font-size:1.6rem;margin-top:0.4rem;">${lowStockCount}</div>
          </div>
          <div style="flex:1;background:var(--card);padding:1rem;border:1px solid var(--border);border-radius:var(--radius);">
            <div style="font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.12em;">Out of Stock</div>
            <div style="font-size:1.6rem;margin-top:0.4rem;">${outOfStockCount}</div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      </div>
    </div>`);
}

// ── Modal System ──────────────────────────────────────────────────────
function showModal(html, product) {
  closeModal();
  if (product) window.__detailProduct = product;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = html;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const el = document.getElementById('modalOverlay');
  if (el) el.remove();
  document.body.style.overflow = '';
}

// ── Toast ─────────────────────────────────────────────────────────────
function showToast(msg, type='info') {
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3300);
}

// ── Input error highlight ─────────────────────────────────────────────
function highlight(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('field-error');
  el.addEventListener('input', () => el.classList.remove('field-error'), { once: true });
}

// ── Error Banner ──────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.innerHTML = `⚠ ${esc(msg)} — Click <strong>API</strong> in the header to set the correct backend URL.`;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('errorBanner').style.display = 'none';
}

// ── Load data ─────────────────────────────────────────────────────────
async function loadCategories() {
  try { allCategories = await API.categories.list(); } catch(_) { allCategories = []; }
}

async function loadProducts() {
  try {
    allProducts = await API.products.list();
    hideError();
  } catch(e) {
    showError(`Could not reach backend at ${API_BASE}. ${e.message}`);
    allProducts = [];
  }
  renderProducts();
}

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('productsGrid').innerHTML = `
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:38%"></div><div class="skel-line" style="width:75%"></div><div class="skel-line" style="width:55%"></div></div></div>
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:44%"></div><div class="skel-line" style="width:80%"></div><div class="skel-line" style="width:60%"></div></div></div>
    <div class="skel-card"><div class="skel-img"></div><div class="skel-body"><div class="skel-line" style="width:33%"></div><div class="skel-line" style="width:70%"></div><div class="skel-line" style="width:50%"></div></div></div>`;

  await loadCategories();
  renderCatNav();
  await loadProducts();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
init();
</script>
</body>
</html>
