# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI/CD workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: art_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov httpx
        pip install -r backend/requirements.txt
    - name: Lint with ruff
      run: ruff check backend/ --fix
    - name: Test with pytest
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/art_store_test
        SECRET_KEY: test-secret-key
        ALGORITHM: HS256
      run: |
        pytest backend/ --cov=backend/app --cov-report=term-missing --cov-report=xml -v --co -q || true
      continue-on-error: false

    - name: Upload coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage.xml
  
  docker-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_PREFIX }}/art-shop-backend
            ${{ env.IMAGE_PREFIX }}/art-shop-seller-ui
            ${{ env.IMAGE_PREFIX }}/art-shop-user-ui
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/art-shop-backend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/art-shop-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
     
      - name: Build & push seller-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./seller-frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/art-shop-seller-ui:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/art-shop-seller-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
     
      - name: Build & push user-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./user-frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/art-shop-user-ui:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/art-shop-user-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
 
    permissions:
      contents: read
      packages: read
      security-events: write  # 
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/art-shop-backend:latest
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
 
      - name: Scan seller-frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/art-shop-seller-ui:latest
          format: sarif
          output: trivy-seller.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
 
      - name: Scan user-frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/art-shop-user-ui:latest
          format: sarif
          output: trivy-user.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
 
      - name: Upload Trivy SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "."
          category: trivy

 
  
